<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173e35" />
    <!-- theme-bootstrap -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <section id="startup-error" role="alert" hidden>
      <p>The page could not finish loading.</p>
      <button id="startup-reload" type="button" class="action-button">Reload page</button>
    </section>
  </body>
</html>
